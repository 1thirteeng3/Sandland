[package]
name = "sandland"
version = "0.1.0"
description = "Sandland Local-First Analytical Knowledge Environment"
authors = ["Sandland Engineering"]
edition = "2021"

[lib]
name = "sandland_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
cc = "1.1"

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-fs = "2.0.0"

# Async & Concurrency
tokio = { version = "1.40", features = ["full"] }

# Serialization & Messaging
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"

# Error Handling
thiserror = "1.0"

# Storage & Relational Database
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }
refinery = { version = "0.8", features = ["rusqlite"] }

# File Watcher
notify = "6.1"
notify-debouncer-full = "0.3"

# AI: Local SLM Inference & Embeddings
# Fastembed for lightweight multilingual ONNX embeddings
fastembed = { version = "3.9", default-features = false, features = ["online", "ort-load-dynamic"] }
# Bindings for local GGUF inference via llama.cpp
llama-cpp-2 = { version = "0.1", optional = true }

# Utilities
uuid = { version = "1.10", features = ["v7", "serde"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"

[features]
default = []
local-ai = ["llama-cpp-2"]
